<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" id="hl-light" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" id="hl-dark" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
// Runs before first paint so a saved theme never flashes. "system" follows the OS setting.
const THEME_KEY = "i-read-code:theme";
const SYSTEM_DARK = window.matchMedia("(prefers-color-scheme: dark)");
function themePref() {
  try { const v = localStorage.getItem(THEME_KEY); if (v === "light" || v === "dark") return v; } catch (e) {}
  return "system";
}
function applyTheme(pref) {
  const dark = pref === "dark" || (pref === "system" && SYSTEM_DARK.matches);
  const root = document.documentElement;
  root.dataset.theme = dark ? "dark" : "light";
  root.dataset.themePref = pref;
  const light = document.getElementById("hl-light"), darkSheet = document.getElementById("hl-dark");
  if (light) light.media = dark ? "not all" : "all";
  if (darkSheet) darkSheet.media = dark ? "all" : "not all";
}
applyTheme(themePref());
</script>
<style>
:root { color-scheme: light;
  --bg: #f8fafc; --panel: #ffffff; --panel-2: #f1f5f9; --text: #0f172a; --muted: #5b6b80;
  --border: #e2e8f0; --border-strong: #cbd5e1;
  --accent: #2563eb; --accent-soft: #eff4ff; --on-accent: #ffffff;
  --ok: #15803d; --ok-soft: #e7f8ee; --on-ok: #ffffff;
  --bad: #b91c1c; --bad-soft: #fdecec;
  --warn: #a16207; --orange: #c2410c; --orange-soft: #fff1e6; --on-orange: #ffffff;
  --add-bg: #ecfdf3; --add-mk: #15803d; --del-bg: #fef2f2; --del-mk: #b91c1c; --focus-bg: #fef6c7;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.06);
  --radius: 8px; --radius-sm: 6px;
  --ease: cubic-bezier(0.2, 0, 0, 1); --fast: 140ms;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b1120; --panel: #0f172a; --panel-2: #1a2436; --text: #e2e8f0; --muted: #94a3b8;
  --border: #243045; --border-strong: #334155;
  --accent: #60a5fa; --accent-soft: #15233f; --on-accent: #0b1120;
  --ok: #4ade80; --ok-soft: #0f2a1b; --on-ok: #052e16;
  --bad: #f87171; --bad-soft: #351416;
  --warn: #facc15; --orange: #fb923c; --orange-soft: #33200f; --on-orange: #2a1204;
  --add-bg: #0e2619; --add-mk: #4ade80; --del-bg: #2a1215; --del-mk: #f87171; --focus-bg: #332d0f;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; color: inherit; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm); }
code { font-family: var(--mono); font-size: 0.88em; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.ic.sm { width: 14px; height: 14px; vertical-align: -2px; }
.ic.xs { width: 12px; height: 12px; vertical-align: -1px; }

/* ---------- top bar ---------- */
header.top { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.brand .logo { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--text); color: var(--panel); }
.sep { width: 1px; height: 22px; background: var(--border); flex: none; }
.branch { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.branch b { color: var(--text); font: 500 12.5px var(--mono); }
.progress { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.progress strong { color: var(--text); font-weight: 600; }
.bar { width: 160px; height: 6px; border-radius: 99px; background: var(--panel-2); overflow: hidden; display: flex; box-shadow: inset 0 0 0 1px var(--border); }
.bar i { display: block; height: 100%; transition: width 300ms var(--ease); }
.bar .c { background: var(--ok); } .bar .d { background: var(--orange); }
.save { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.save::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.save.off { color: var(--bad); font-weight: 600; } .save.off::before { background: var(--bad); }
.save.done::before { background: var(--muted); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); padding: 5px 12px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; white-space: nowrap; box-shadow: var(--shadow-sm); transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease), color var(--fast) var(--ease), transform 80ms var(--ease); }
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.btn.ok:hover:not(:disabled) { background: var(--ok); filter: brightness(1.08); }
.btn.ok-ghost { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
.btn.ok-ghost:hover:not(:disabled) { background: var(--ok-soft); }
.btn.change { border-color: color-mix(in srgb, var(--orange) 55%, var(--border)); color: var(--orange); }
.btn.change:hover:not(:disabled) { background: var(--orange-soft); }
.btn.change.solid { background: var(--orange); border-color: var(--orange); color: var(--on-orange); }
.btn.change.solid:hover:not(:disabled) { background: var(--orange); filter: brightness(1.08); }
.btn:disabled { opacity: 0.45; box-shadow: none; }
.btn.link { border: none; background: none; box-shadow: none; color: var(--accent); padding: 4px 6px; min-height: 28px; }
.btn.link:hover:not(:disabled) { background: var(--accent-soft); }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn .count { font: 600 11px var(--mono); padding: 0 6px; border-radius: 99px; background: color-mix(in srgb, currentColor 14%, transparent); }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr) 320px; height: calc(100% - 56px); }
.pane { overflow: auto; min-height: 0; scrollbar-width: thin; }
nav.files { border-right: 1px solid var(--border); background: var(--panel); padding: 12px 10px 40px; }
aside.related { border-left: 1px solid var(--border); background: var(--panel); padding: 16px 16px 40px; }
main.main { padding: 0 0 80px; }

/* ---------- file list ---------- */
.nav-item { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 5px 8px; border-radius: var(--radius-sm); border: none; background: none; color: var(--text); text-align: left; font-size: 13px; transition: background var(--fast) var(--ease); }
.nav-item:hover { background: var(--panel-2); }
.nav-item.active { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.nav-item .path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; font-family: var(--mono); font-size: 12.5px; }
.nav-item .path span { unicode-bidi: plaintext; }
.nav-item .path.plain { font-family: var(--sans); font-size: 13px; font-weight: 600; }
.nav-item .dir { color: var(--muted); }
.nav-item.gen { opacity: 0.6; }
.st { display: inline-grid; place-items: center; font: 600 10.5px var(--mono); width: 18px; height: 18px; border-radius: 4px; flex: none; background: var(--panel-2); }
.st-A { color: var(--ok); background: var(--ok-soft); } .st-M { color: var(--warn); } .st-D { color: var(--bad); background: var(--bad-soft); }
.st-R, .st-C { color: var(--accent); background: var(--accent-soft); } .st-ctx { color: var(--muted); background: none; }
.chip { display: inline-flex; align-items: center; gap: 3px; font: 500 11px var(--mono); padding: 1px 7px; border-radius: 99px; background: var(--panel-2); color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.chip.has-bad { background: var(--orange-soft); color: var(--orange); }
.search { position: relative; margin: 10px 0 0; }
.search .ic { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.filter { width: 100%; min-height: 34px; padding: 6px 10px 6px 32px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font: inherit; font-size: 13px; transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease); }
.filter::placeholder { color: var(--muted); }
.filter:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.section-label { display: flex; align-items: center; justify-content: space-between; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 16px 8px 6px; font-weight: 600; }
.imp-filter { display: flex; gap: 0; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
.imp-filter button { flex: 1; min-height: 28px; border: none; border-left: 1px solid var(--border); background: var(--panel); color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; transition: background var(--fast) var(--ease), color var(--fast) var(--ease); }
.imp-filter button:first-child { border-left: none; }
.imp-filter button:hover { background: var(--panel-2); }
.imp-filter button.on.imp-high { background: var(--bad-soft); color: var(--bad); }
.imp-filter button.on.imp-medium { background: var(--accent-soft); color: var(--accent); }
.imp-filter button.on.imp-low { background: var(--panel-2); color: var(--text); }
.bulk { display: grid; gap: 6px; }
.bulk .btn { width: 100%; justify-content: flex-start; }
.bulk .btn .count { margin-left: auto; }
.bulk .hint { font-size: 11.5px; color: var(--muted); margin: 2px 2px 0; }

/* ---------- main ---------- */
.banner { display: flex; gap: 8px; align-items: flex-start; margin: 12px 20px 0; padding: 10px 12px; border-radius: var(--radius); background: var(--bad-soft); color: var(--bad); font-size: 13px; border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }
.file-head { position: sticky; top: 0; z-index: 3; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); padding: 12px 24px 12px; border-bottom: 1px solid var(--border); }
.file-head h2 { margin: 0; font: 600 14.5px var(--mono); word-break: break-all; min-width: 0; }
.file-head .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.file-head .stats { font: 12px var(--mono); color: var(--muted); }
.file-head .stats .a { color: var(--add-mk); } .file-head .stats .r { color: var(--del-mk); }
.head-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
.seg button { border: none; min-height: 30px; background: var(--panel); color: var(--muted); padding: 3px 11px; font-size: 12px; font-weight: 500; transition: background var(--fast) var(--ease); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.summary { color: var(--text); margin-top: 6px; font-size: 13.5px; max-width: 80ch; }
.summary p { margin: 4px 0; }
.content { padding: 16px 24px; }
.empty { color: var(--muted); padding: 20px; }

/* ---------- code ---------- */
table.code { width: 100%; border-collapse: separate; border-spacing: 0; font: 12.5px/1.6 var(--mono); background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
table.code td { padding: 0 10px; vertical-align: top; }
td.no { width: 1%; min-width: 46px; text-align: right; color: var(--muted); user-select: none; white-space: nowrap; opacity: 0.75; font-size: 11.5px; }
td.mk { width: 14px; padding: 0 2px; user-select: none; text-align: center; }
td.src { white-space: pre-wrap; overflow-wrap: anywhere; width: 100%; }
tr.add { background: var(--add-bg); } tr.add td.mk { color: var(--add-mk); }
tr.del { background: var(--del-bg); } tr.del td.mk { color: var(--del-mk); }
tr.ln td:first-child { border-left: 3px solid transparent; }
tr.cov.s-pending td:first-child { border-left-color: var(--accent); }
tr.cov.s-confirmed td:first-child { border-left-color: var(--ok); }
tr.cov.s-declined td:first-child { border-left-color: var(--orange); }
tr.hl td.src, tr.hl td.no { background: var(--focus-bg); }
tr.focus-line td { background: var(--focus-bg); }
tr.hunk td { background: var(--panel-2); color: var(--muted); padding: 4px 10px; font-size: 11.5px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
tr.gap td { background: var(--panel-2); color: var(--accent); padding: 3px 10px; font-size: 11.5px; cursor: pointer; text-align: center; transition: background var(--fast) var(--ease); }
tr.gap:hover td { background: var(--accent-soft); }
tr.removed-note td { color: var(--del-mk); font-size: 11.5px; padding: 1px 10px; background: var(--del-bg); }
tr.card-row td { padding: 10px 12px; background: var(--bg); font-family: var(--sans); font-size: 14px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

/* ---------- review cards ---------- */
.card { position: relative; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); padding: 12px 16px 12px 18px; max-width: 880px; box-shadow: var(--shadow-sm); transition: box-shadow var(--fast) var(--ease), border-color var(--fast) var(--ease); }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: var(--radius) 0 0 var(--radius); background: var(--accent); }
.card + .card { margin-top: 10px; }
.card.s-confirmed::before { background: var(--ok); }
.card.s-declined::before { background: var(--orange); }
.card.s-confirmed { background: color-mix(in srgb, var(--ok-soft) 35%, var(--panel)); }
.card.focused { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-md); }
.card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-title { font-weight: 600; font-size: 14.5px; }
.where { font: 11.5px var(--mono); color: var(--muted); margin-left: auto; }
.imp { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; padding: 2px 6px; border-radius: 4px; line-height: 1.3; }
.imp-high { background: var(--bad-soft); color: var(--bad); }
.imp-medium { background: var(--accent-soft); color: var(--accent); }
.imp-low { background: var(--panel-2); color: var(--muted); }
.auto-tag { font-size: 11px; color: var(--muted); font-style: italic; }
.expl { max-width: 78ch; } .expl p { margin: 6px 0; } .expl ul { margin: 6px 0; padding-left: 20px; }
.concerns { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; padding: 8px 10px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--warn) 9%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); font-size: 13px; }
.concerns > .ic { color: var(--warn); margin-top: 2px; }
.concerns p { margin: 0; display: inline; }
.actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.verdict { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 13px; }
.verdict.ok { color: var(--ok); } .verdict.change { color: var(--orange); }
.reason { margin-top: 8px; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--orange-soft); white-space: pre-wrap; font-size: 13px; }
.decline-form { margin-top: 10px; }
.decline-form label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.decline-form textarea { width: 100%; min-height: 76px; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--orange); background: var(--bg); color: var(--text); font: inherit; resize: vertical; }
.decline-form textarea:focus { outline: none; box-shadow: 0 0 0 3px var(--orange-soft); }
.decline-form .hint { font-size: 12px; color: var(--muted); }
.notes-block { margin-bottom: 14px; }

/* ---------- questions to Claude ---------- */
.actions .ask-btn { margin-left: auto; }
.ask { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border-strong); max-width: 78ch; }
.qa + .qa, .qa + .ask-form { margin-top: 14px; }
.qa .q { display: inline-block; max-width: 100%; padding: 6px 10px; border-radius: var(--radius-sm); background: var(--accent-soft); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; font-weight: 500; }
.qa .a { margin-top: 6px; font-size: 13.5px; overflow-wrap: anywhere; }
.qa .a p { margin: 6px 0; } .qa .a ul, .qa .a ol { margin: 6px 0; padding-left: 20px; }
.qa .a .ans-h { font-weight: 600; margin-top: 10px; }
.ans-code { margin: 8px 0; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius-sm); font: 12px/1.55 var(--mono); overflow-x: auto; white-space: pre; }
.ans-code code { background: none; border: none; padding: 0; font-size: inherit; }
.ask-form label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.ask-form textarea { width: 100%; min-height: 64px; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font: inherit; resize: vertical; transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease); }
.ask-form textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ask-form .hint, .ask-note { font-size: 12px; color: var(--muted); }
.ask-status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.spin { width: 12px; height: 12px; flex: none; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ov-ask { margin-top: 22px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); padding: 12px 16px; box-shadow: var(--shadow-sm); }
.ov-ask h3 { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 14.5px; }
.ov-ask .ask { border-top: none; margin-top: 4px; padding-top: 0; }

/* ---------- right pane ---------- */
aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
aside section + section { margin-top: 24px; }
.rel { display: block; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: var(--radius); padding: 9px 11px; margin-bottom: 8px; transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease); }
.rel:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
.rel .rp { font: 600 12px var(--mono); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.rel .rp span:first-child { flex: 1 1 auto; min-width: 0; }
.rel .rr { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.kind { font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: 0.06em; padding: 1px 5px; border-radius: 4px; flex: none; }
.kind.changed { background: var(--accent-soft); color: var(--accent); }
.kind.context { background: var(--panel-2); color: var(--muted); }
.mini { display: flex; gap: 8px; align-items: center; width: 100%; min-height: 30px; padding: 5px 6px; border: none; background: none; color: var(--text); text-align: left; border-radius: var(--radius-sm); font-size: 13px; transition: background var(--fast) var(--ease); }
.mini:hover { background: var(--panel-2); }
.mini .t { flex: 1; min-width: 0; }

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("review-data").textContent);
const FILES = new Map(DATA.files.map(f => [f.path, f]));
const CTX = new Map(DATA.context_files.map(f => [f.path, f]));
const CHANGES = new Map(DATA.changes.map(c => [c.id, c]));
const BY_FILE = new Map();
for (const c of DATA.changes) {
  if (!BY_FILE.has(c.file)) BY_FILE.set(c.file, []);
  BY_FILE.get(c.file).push(c);
}
const HL = window.hljs || null;
const $ = id => document.getElementById(id);
const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const state = {
  decisions: {}, online: false, finished: false,
  view: { kind: "overview" }, history: [],
  focus: null, editing: null, draft: "", mode: "diff",
  expanded: new Set(), showGenerated: new Set(), filter: "",
  importance: new Set(["high", "medium", "low"]),
  // Questions: thread id is a change id or GENERAL; live holds the answer streaming in per thread.
  ask: { available: false, forked: false }, threads: {}, askOpen: new Set(), askDraft: {}, live: {},

const GENERAL = "general";

// ---------- helpers ----------
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(src) {
  if (!src) return "";
  return String(src).trim().split(/\n{2,}/).map(block => {
    const lines = block.split("\n");
    if (lines.every(l => /^\s*[-*] /.test(l))) {
      return "<ul>" + lines.map(l => "<li>" + inline(l.replace(/^\s*[-*] /, "")) + "</li>").join("") + "</ul>";
    }
    return "<p>" + lines.map(inline).join("<br>") + "</p>";
  }).join("");
}
// Claude's answers use more Markdown than explanations do: fenced code, headings, numbered lists,
// lists right under a line of text. An unclosed fence (mid-stream) renders as code so far.
function richMd(src) {
  src = String(src || "");
  let out = "", last = 0;
  for (const m of src.matchAll(/```([\w+#.-]*)[^\n]*\n([\s\S]*?)(?:\n?```|$)/g)) {
    out += textMd(src.slice(last, m.index));
    const name = LANG_ALIAS[m[1].toLowerCase()] || m[1].toLowerCase();
    out += `<pre class="ans-code"><code>${code(m[2].replace(/\s+$/, ""),HL && name && HL.getLanguage(name) ? name : null)}</code></pre>`;
    last = m.index + m[0].length;

}
function textMd(src) {
  let h = "", para = [], list = null;
  const flushPara = () => { if (para.length) h += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; };
  const flushList = () => { if (list) h += `<${list.tag}>${list.items.map(i => "<li>" + inline(i) + "</li>").join("")}</${list.tag}>`; list = null; };
  for (const raw of src.split("\n")) {
    const line = raw.trim();
    let m;
    if (!line) { flushPara(); flushList(); }
    else if ((m = line.match(/^#{1,6}\s+(.*)/))) { flushPara(); flushList(); h += `<p class="ans-h">${inline(m[1])}</p>`; }
    else if ((m = raw.match(/^\s*(?:[-*]|(\d+)[.)])\s+(.*)/))) {
      flushPara();
      const tag = m[1] ? "ol" : "ul";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push(m[2]);
    } else if (list && /^\s/.test(raw)) list.items[list.items.length - 1] += " " + line;

}
const ic = (name, size = "sm") => `<svg class="ic ${size}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const LANG_ALIAS = { htm: "xml", html: "xml", vue: "xml", svelte: "xml", svg: "xml", jsx: "javascript", mjs: "javascript", cjs: "javascript", tsx: "typescript", yml: "yaml", h: "c", hpp: "cpp", cc: "cpp", kt: "kotlin", rs: "rust", rb: "ruby", py: "python", sh: "bash", zsh: "bash", md: "markdown", tf: "ini", toml: "ini" };
function langFor(path) {
  if (!HL) return null;
  const base = path.split("/").pop().toLowerCase();
  if (base === "dockerfile") return HL.getLanguage("dockerfile") ? "dockerfile" : null;
  if (base === "makefile") return HL.getLanguage("makefile") ? "makefile" : null;
  const ext = base.includes(".") ? base.split(".").pop() : "";
  const lang = LANG_ALIAS[ext] || ext;
  return lang && HL.getLanguage(lang) ? lang : null;
}
const hlCache = new Map();
function code(text, lang) {
  if (!text) return " ";

  const key = lang + "\u0000" + text;

    let out;
    try { out = HL.highlight(text, { language: lang, ignoreIllegals: true }).value; } catch (e) { out = esc(text); }
    hlCache.set(key, out);

}
function splitPath(p) {
  const i = p.lastIndexOf("/");
  return i < 0 ? ["", p] : [p.slice(0, i + 1), p.slice(i + 1)];
}
const STATUS_LETTER = { added: "A", modified: "M", deleted: "D", renamed: "R", copied: "C", typechange: "T" };
function decision(id) { return state.decisions[id] || { status: "pending", reason: "" }; }
function countsFor(list) {
  const c = { total: list.length, confirmed: 0, declined: 0, pending: 0 };
  for (const x of list) c[decision(x.id).status]++;

}
const pendingIds = list => list.filter(x => decision(x.id).status === "pending").map(x => x.id);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
function whereLabel(c) {
  if (c.start == null) return "whole file";
  const r = c.start === c.end ? `L${c.start}` : `L${c.start}–${c.end}`;
  return c.side === "old" ? `${r} (old)` : r;
}

// ---------- coverage (mirrors build_review.py) ----------
function* walk(h) {
  let o = h.old_start + (h.old_lines === 0 ? 1 : 0);
  let n = h.new_start + (h.new_lines === 0 ? 1 : 0);
  for (const ln of h.lines) {
    const kind = ln[0];
    yield [ln, kind !== "del" ? ln[2] : n, kind !== "add" ? ln[1] : o];
    if (kind !== "add") o++;
    if (kind !== "del") n++;
  }
}
function covers(c, kind, na, oa) {
  if (c.start == null) return false;
  if (c.side === "new") return kind !== "del" ? c.start <= na && na <= c.end : c.start <= na && c.end >= na - 1;
  if (c.side === "old") return kind !== "add" ? c.start <= oa && oa <= c.end : c.start <= oa && c.end >= oa - 1;
  return false;
}

// ---------- rendering ----------
function renderHeader() {
  const m = DATA.meta;
  $("branch").innerHTML = `${ic("branch")}<b>${esc(m.head)}</b> vs <b>${esc(m.base)}</b><span>· ${esc(m.merge_base.slice(0, 8))}${m.include_uncommitted ? " · incl. uncommitted" : ""}</span>`;
  const c = countsFor(DATA.changes);
  const done = c.confirmed + c.declined;
  $("count").innerHTML = `<strong>${done}</strong> / ${c.total} reviewed${c.declined ? ` · ${c.declined} change${c.declined === 1 ? "" : "s"} requested` : ""}`;
  const pct = n => (c.total ? (100 * n / c.total) : 0) + "%";
  const bar = $("bar");
  bar.innerHTML = `<i class="c" style="width:${pct(c.confirmed)}"></i><i class="d" style="width:${pct(c.declined)}"></i>`;

  s.title = state.finished ? "" : state.online ? "Every decision is saved to review.json" : "Decisions won't be saved";
  document.title = `Review · ${m.head}`;

}

// ---------- theme ----------
const THEME_ORDER = ["system", "light", "dark"];
const THEME_ICON = { system: "monitor", light: "sun", dark: "moon" };
function renderThemeButton() {
  const pref = document.documentElement.dataset.themePref || "system";
  const next = THEME_ORDER[(THEME_ORDER.indexOf(pref) + 1) % THEME_ORDER.length];
  const b = $("theme");
  b.innerHTML = ic(THEME_ICON[pref], "");

function cycleTheme() {
  const pref = document.documentElement.dataset.themePref || "system";
  const next = THEME_ORDER[(THEME_ORDER.indexOf(pref) + 1) % THEME_ORDER.length];
  try { if (next === "system") localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(next);
  renderThemeButton();
}
SYSTEM_DARK.addEventListener("change", () => applyTheme(document.documentElement.dataset.themePref || "system"));

function fileChip(path) {
  const c = countsFor(BY_FILE.get(path) || []);
  if (!c.total) return "";
  if (c.declined) return `<span class="chip has-bad" title="${c.declined} change(s) requested">${ic("pencil", "xs")}${c.declined} · ${c.confirmed + c.declined}/${c.total}</span>`;
  if (!c.pending) return `<span class="chip done" title="All confirmed">${ic("check", "xs")}${c.total}</span>`;

}
// With every level picked, all files show; otherwise only files with an item at a picked level.
function fileVisible(f) {
  if (state.importance.size === 3) return true;
  return (BY_FILE.get(f.path) || []).some(c => state.importance.has(c.importance));
}
function pathLabel(p) {
  const [dir, base] = splitPath(p);

}
// High-importance items are deliberately left out: those need a real read.
function bulkButtons() {
  const dis = state.online ? "" : "disabled";

    const n = pendingIds(DATA.changes.filter(c => c.importance === lv)).length;
    const label = lv[0].toUpperCase() + lv.slice(1);
    return `<button class="btn ok-ghost" data-act="confirm-level" data-level="${lv}" ${n && !dis ? "" : "disabled"} title="Confirm every pending ${lv}-importance item">${ic("check-all")}Confirm all ${label} Importance<span class="count">${n}</span></button>`;
  }).join("");
}
function renderFiles() {
  const v = state.view;
  const all = countsFor(DATA.changes);
  const q = state.filter.toLowerCase();
  let h = `<button class="nav-item ${v.kind === "overview" ? "active" : ""}" data-act="overview"><span class="st st-ctx">${ic("list", "xs")}</span><span class="path plain"><span>Overview</span></span><span class="chip ${all.pending ? "" : "done"}">${all.confirmed + all.declined}/${all.total}</span></button>`;
  h += `<div class="search">${ic("search")}<input class="filter" id="filter" type="search" aria-label="Filter files" placeholder="Filter files…" value="${esc(state.filter)}"></div>`;
  h += `<div class="section-label">Importance</div>`;
  h += `<div class="imp-filter" role="group" aria-label="Show files by importance">${["high", "medium", "low"].map(lv => `<button class="imp-${lv} ${state.importance.has(lv) ? "on" : ""}" data-act="importance" data-level="${lv}" aria-pressed="${state.importance.has(lv)}" title="Show files with ${lv}-importance items">${lv}</button>`).join("")}</div>`;
  h += `<div class="section-label">Quick confirm</div><div class="bulk">${bulkButtons()}</div>`;

  for (const f of shown) {
    if (q && !f.path.toLowerCase().includes(q)) continue;

    h += `<button class="nav-item ${f.generated ? "gen" : ""} ${v.kind === "file" && v.path === f.path ? "active" : ""}" data-act="open" data-path="${esc(f.path)}" title="${esc(f.path)}"><span class="st st-${L}">${L}</span>${pathLabel(f.path)}${fileChip(f.path)}</button>`;

function cardHtml(c) {

    actions = `<div class="actions"><span class="verdict ok">${ic("check")}Confirmed</span><button class="btn link" data-act="undo" data-id="${esc(c.id)}">${ic("undo")}Undo</button>${askBtn}</div>`;
  } else if (d.status === "declined") {
    actions = `<div class="reason">${esc(d.reason)}</div><div class="actions"><span class="verdict change">${ic("pencil")}Changes requested</span><button class="btn link" data-act="decline" data-id="${esc(c.id)}">Edit reason</button><button class="btn link" data-act="undo" data-id="${esc(c.id)}">${ic("undo")}Undo</button>${askBtn}</div>`;
  } else {
    const dis = state.online ? "" : "disabled";
    actions = `<div class="actions"><button class="btn ok" data-act="confirm" data-id="${esc(c.id)}" ${dis}>${ic("check")}Confirm</button><button class="btn change" data-act="decline" data-id="${esc(c.id)}" ${dis}>${ic("pencil")}Request Change</button>${askBtn}</div>`;
  }
  const askOpen = state.ask.available && (state.askOpen.has(c.id) || state.live[c.id]);
  return `<div class="card s-${d.status} ${state.focus === c.id ? "focused" : ""}" data-card="${esc(c.id)}">
    <div class="card-head"><span class="imp imp-${c.importance}">${c.importance}</span><span class="card-title">${esc(c.title)}</span>${c.auto ? `<span class="auto-tag">added automatically</span>` : ""}<span class="where">${esc(whereLabel(c))}</span></div>
    <div class="expl">${md(c.explanation)}</div>
    ${c.concerns ? `<div class="concerns">${ic("alert")}<div><strong>Worth checking:</strong> ${md(c.concerns)}</div></div>` : ""}
    ${actions}${askOpen ? askPanel(c.id) : ""}</div>`;
}

// ---------- questions to Claude ----------
function askButton(id) {
  if (!state.ask.available) return "";
  const n = (state.threads[id] || []).length;
  const open = state.askOpen.has(id);
  return `<button class="btn link ask-btn" data-act="ask" data-id="${esc(id)}" aria-expanded="${open}" title="Ask Claude about this change (a)" ${state.online ? "" : "disabled"}>${ic("message")}${open ? "Hide questions" : "Ask Claude"}${n ? `<span class="count">${n}</span>` : ""}</button>`;
}
function liveHtml(live) {
  return `${richMd(live.text)}<div class="ask-status" role="status"><span class="spin" aria-hidden="true"></span>${esc(live.status || "Writing…")}</div>`;
}
function askPanel(tid) {
  const live = state.live[tid];
  let h = `<div class="ask">`;
  for (const m of state.threads[tid] || []) {
    h += `<div class="qa"><div class="q">${esc(m.question)}</div><div class="a">${richMd(m.answer)}</div></div>`;
  }
  if (live) {
    h += `<div class="qa"><div class="q">${esc(live.question)}</div><div class="a" data-live="${esc(tid)}">${liveHtml(live)}</div></div>`;
  } else {
    const first = !(state.threads[tid] || []).length;
    const label = first ? (tid === GENERAL ? "Your question" : "Ask Claude about this change") : "Follow-up question";
    const inputId = "ask-" + tid;
    h += `<div class="ask-form"><label for="${esc(inputId)}">${label}</label><textarea id="${esc(inputId)}" data-ask-input="${esc(tid)}" placeholder="${first ? "Why is it done this way? What calls this? Is X handled?" : "Ask a follow-up…"}" ${state.online ? "" : "disabled"}>${esc(state.askDraft[tid] || "")}</textarea>
      <div class="actions"><button class="btn primary" data-act="ask-submit" data-id="${esc(tid)}" ${state.online ? "" : "disabled"}>${ic("message")}Ask</button><span class="hint"><kbd>⌘</kbd>/<kbd>Ctrl</kbd>+<kbd>Enter</kbd> send${tid === GENERAL ? "" : " · <kbd>Esc</kbd> close"}</span></div>
      ${first && !state.ask.forked ? `<div class="ask-note">Answers come from a new Claude session that can read the code but didn't write this review.</div>` : ""}</div>`;
  }
  return h + `</div>`;
}
function paintLive(tid) {
  const el = document.querySelector(`[data-live="${CSS.escape(tid)}"]`);
  if (el && state.live[tid]) el.innerHTML = liveHtml(state.live[tid]);
}
function openAsk(id) {
  state.askOpen.add(id);
  renderAll();
  const t = document.querySelector(`[data-ask-input="${CSS.escape(id)}"]`);
  if (t) { t.focus(); t.scrollIntoView({ block: "nearest" }); }
}
async function ask(tid) {
  const question = (state.askDraft[tid] || "").trim();
  if (!question || state.live[tid] || !state.online) return;
  const live = state.live[tid] = { question, text: "", status: "Thinking…" };
  state.askDraft[tid] = "";
  renderAll();
  try {
    const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ change_id: tid === GENERAL ? null : tid, question }) });
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || `HTTP ${res.status}`); }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", done = false;
    for (;;) {
      const { value, done: end } = await reader.read();
      if (end) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "text") { live.text += ev.text; live.status = ""; }
        else if (ev.type === "status") live.status = ev.status + "…";
        else if (ev.type === "error") throw new Error(ev.error);
        else if (ev.type === "done") { state.threads[tid] = ev.thread.messages; done = true; }
        paintLive(tid);
      }
    }
    if (!done) throw new Error("the answer stopped before it finished");
  } catch (e) {
    state.askDraft[tid] = state.askDraft[tid] || question;
    toast("Couldn't get an answer: " + e.message);
  }
  delete state.live[tid];
  renderAll();
}
const cardRow = cards => cards.length ? `<tr class="card-row"><td colspan="4">${cards.map(cardHtml).join("")}</td></tr>` : "";

function rowHtml(kind, o, n, text, lang, ids, extra = "") {
  const st = ids.length ? " cov s-" + decision(ids[0]).status : "";
  const mk = kind === "add" ? "+" : kind === "del" ? "−" : "";
  return `<tr class="ln ${kind}${st}${extra}" ${ids.length ? `data-ids="${esc(ids.join(" "))}"` : ""}><td class="no">${o ?? ""}</td><td class="no">${n ?? ""}</td><td class="mk">${mk}</td><td class="src">${code(text, lang)}</td></tr>`;
}

function contentLines(f) {
  if (f._lines === undefined) {
    f._lines = f.content == null ? null : f.content.replace(/\n$/, "").split("\n");
  }
  return f._lines;
}

function gapRow(f, from, to, offset, key) {
  if (to < from) return "";
  const lines = contentLines(f);
  const lang = langFor(f.path);
  if (state.expanded.has(key) && lines) {
    let h = "";
    for (let n = from; n <= to; n++) h += rowHtml("ctx", n + offset, n, lines[n - 1] ?? "", lang, []);
    return h;
  }
  const n = to - from + 1;
  return lines ? `<tr class="gap" data-act="expand" data-key="${esc(key)}"><td colspan="4">⋯ show ${n} unchanged line${n === 1 ? "" : "s"}</td></tr>` : "";
}

function diffBody(f, changes) {
  const lang = langFor(f.path);
  const placed = new Set();
  const ranged = changes.filter(c => c.start != null);
  let h = "";
  let nextNew = 1;
  f.hunks.forEach((hk, hi) => {
    const startNew = hk.new_start + (hk.new_lines === 0 ? 1 : 0);
    const startOld = hk.old_start + (hk.old_lines === 0 ? 1 : 0);
    if (f.status !== "deleted") h += gapRow(f, nextNew, startNew - 1, startOld - startNew, `${f.path}#${hi}`);
    h += `<tr class="hunk"><td colspan="4">@@ −${hk.old_start},${hk.old_lines} +${hk.new_start},${hk.new_lines} @@ ${esc(hk.header)}</td></tr>`;
    for (const [ln, na, oa] of walk(hk)) {
      const ids = ranged.filter(c => covers(c, ln[0], na, oa)).map(c => c.id);
      const fresh = ranged.filter(c => ids.includes(c.id) && !placed.has(c.id));
      fresh.forEach(c => placed.add(c.id));
      h += cardRow(fresh);
      h += rowHtml(ln[0], ln[1], ln[2], ln[3], lang, ids);
    }
    nextNew = startNew + hk.new_lines;
  });
  const lines = contentLines(f);
  if (lines && f.status !== "deleted" && f.hunks.length) {
    const last = f.hunks[f.hunks.length - 1];
    const lastOld = last.old_start + (last.old_lines === 0 ? 1 : 0) + last.old_lines;
    h += gapRow(f, nextNew, lines.length, lastOld - nextNew, `${f.path}#end`);
  }
  return { body: h, placed };
}

function fullBody(f, changes) {
  const lines = contentLines(f) || [];
  const lang = langFor(f.path);
  const added = new Set(), removedBefore = new Map();
  for (const hk of f.hunks) for (const [ln, na] of walk(hk)) {
    if (ln[0] === "add") added.add(ln[2]);
    if (ln[0] === "del") removedBefore.set(na, (removedBefore.get(na) || 0) + 1);
  }
  const ranged = changes.filter(c => c.side === "new" && c.start != null);
  const placed = new Set();
  let h = "";
  for (let n = 1; n <= lines.length + 1; n++) {
    if (removedBefore.has(n)) h += `<tr class="removed-note"><td colspan="4">− ${removedBefore.get(n)} line(s) removed here (switch to Diff to see them)</td></tr>`;
    if (n > lines.length) break;
    const kind = added.has(n) ? "add" : "ctx";
    const ids = ranged.filter(c => c.start <= n && n <= c.end).map(c => c.id);
    const fresh = ranged.filter(c => ids.includes(c.id) && !placed.has(c.id));
    fresh.forEach(c => placed.add(c.id));
    h += cardRow(fresh);
    h += rowHtml(kind, "", n, lines[n - 1], lang, ids);
  }
  return { body: h, placed };
}

function backButton() {
  if (!state.history.length) return "";
  const prev = state.history[state.history.length - 1];
  const label = prev.kind === "overview" ? "Overview" : splitPath(prev.path)[1];
  return `<button class="btn link" data-act="back">${ic("back")}Back to ${esc(label)}</button>`;
}

function renderFile(f) {
  const changes = BY_FILE.get(f.path) || [];
  const c = countsFor(changes);
  const canFull = f.content != null && f.status !== "deleted" && !f.binary;
  const mode = canFull ? state.mode : "diff";
  const confirmAll = c.pending
    ? `<button class="btn ok" data-act="confirm-file" data-path="${esc(f.path)}" ${state.online ? "" : "disabled"} title="Confirm every pending item in this file (Shift+C)">${ic("check-all")}Confirm all in file<span class="count">${c.pending}</span></button>`
    : "";
  let head = `<div class="file-head">${backButton()}
    <div class="row"><span class="st st-${STATUS_LETTER[f.status] || "M"}">${STATUS_LETTER[f.status] || "M"}</span><h2>${esc(f.path)}</h2>
    <span class="stats"><span class="a">+${f.additions}</span> <span class="r">−${f.deletions}</span></span>
    <span class="chip ${c.total && !c.pending ? "done" : ""}">${c.confirmed + c.declined}/${c.total} reviewed</span>
    <span class="head-actions">${canFull ? `<span class="seg" role="group" aria-label="View mode"><button class="${mode === "diff" ? "on" : ""}" data-act="mode" data-mode="diff" aria-pressed="${mode === "diff"}">Diff</button><button class="${mode === "full" ? "on" : ""}" data-act="mode" data-mode="full" aria-pressed="${mode === "full"}">Full file</button></span>` : ""}${confirmAll}</span></div>
    ${f.old_path ? `<div class="stats">renamed from ${esc(f.old_path)}</div>` : ""}
    ${f.untracked ? `<div class="stats">untracked file (not yet added to git)</div>` : ""}
    ${f.summary ? `<div class="summary">${md(f.summary)}</div>` : ""}</div>`;
  let body = "", placed = new Set();
  if (f.binary) {
    body = `<div class="empty">Binary file, contents not shown.</div>`;
  } else if (f.generated && !state.showGenerated.has(f.path)) {
    body = `<div class="empty">Generated or lock file, diff hidden. <button class="btn link" data-act="show-generated" data-path="${esc(f.path)}">Show diff</button></div>`;
  } else if (!f.hunks.length) {
    body = `<div class="empty">No line changes.</div>`;
  } else {
    const r = mode === "full" ? fullBody(f, changes) : diffBody(f, changes);
    body = `<table class="code">${r.body}</table>`;
    placed = r.placed;
  }
  const notes = changes.filter(x => !placed.has(x.id));
  return head + `<div class="content">${notes.length ? `<div class="notes-block">${notes.map(cardHtml).join("")}</div>` : ""}${body}</div>`;
}

function renderContext(f) {
  const v = state.view;
  const focus = [];
  for (const link of DATA.connections[f.path] || []) {
    for (const back of DATA.connections[link.path] || []) if (back.path === f.path) focus.push(...back.lines);
  }
  const via = v.from ? (DATA.connections[v.from] || []).find(x => x.path === f.path) : null;
  let head = `<div class="file-head">${backButton()}<div class="row"><span class="kind context">context</span><h2>${esc(f.path)}</h2></div>
    <div class="summary"><p>Unchanged on this branch. Shown because it's connected to the changes${via ? ` (from <code>${esc(v.from)}</code>): ${inline(via.reason)}` : "."}</p></div></div>`;
  if (f.content == null) return head + `<div class="content"><div class="empty">File too large or binary; not shown.</div></div>`;
  const lines = f.content.replace(/\n$/, "").split("\n");
  const lang = langFor(f.path);
  const inFocus = n => focus.some(([s, e]) => s <= n && n <= e);
  let rows = "";
  lines.forEach((t, i) => { rows += rowHtml("ctx", "", i + 1, t, lang, [], inFocus(i + 1) ? " focus-line" : ""); });
  return head + `<div class="content"><table class="code">${rows}</table></div>`;
}

function renderOverview() {
  const m = DATA.meta;
  const c = countsFor(DATA.changes);
  const highPending = pendingIds(DATA.changes.filter(x => x.importance === "high")).length;
  let h = `<div class="overview"><h1>Review of ${esc(m.head)}</h1>
    <div class="meta">Compared with <b>${esc(m.base)}</b> (merge-base <code>${esc(m.merge_base.slice(0, 10))}</code>)${m.include_uncommitted ? ", including uncommitted and untracked changes" : ""}. ${plural(DATA.files.length, "file")} · ${plural(c.total, "review item")}.</div>
    ${(m.notes || []).map(n => `<div class="concerns">${ic("alert")}<div>${esc(n)}</div></div>`).join("")}
    <div class="stat-row">
      <div class="stat"><div class="n">${c.pending}</div><div class="l">Pending</div></div>
      <div class="stat high"><div class="n">${highPending}</div><div class="l">High importance pending</div></div>
      <div class="stat ok"><div class="n">${c.confirmed}</div><div class="l">Confirmed</div></div>
      <div class="stat change"><div class="n">${c.declined}</div><div class="l">Changes requested</div></div>
    </div>
    <div class="text">${md(DATA.overview) || "<p class='empty'>No overview was written.</p>"}</div>`;
  if (state.ask.available) h += `<section class="ov-ask"><h3>${ic("message")}Ask about this branch</h3>${askPanel(GENERAL)}</section>`;
  for (const f of DATA.files) {
    const list = BY_FILE.get(f.path) || [];
    h += `<div class="ov-file"><h4><button data-act="open" data-path="${esc(f.path)}">${esc(f.path)}</button> ${fileChip(f.path)}</h4>${f.summary ? `<div class="fs">${inline(f.summary.split("\n")[0])}</div>` : ""}`;
    for (const x of list) h += miniItem(x);
    h += `</div>`;
  }
  return h + `</div>`;
}

function miniItem(x) {
  const d = decision(x.id);
  return `<button class="mini" data-act="goto" data-id="${esc(x.id)}"><span class="dot ${d.status}" title="${d.status}"></span><span class="imp imp-${x.importance}">${x.importance[0]}</span><span class="t">${esc(x.title)}</span><span class="ml">${esc(whereLabel(x))}</span></button>`;
}

function renderMain() {
  const main = $("main");
  const v = state.view;
  let h = state.online || state.finished ? "" : `<div class="banner" role="alert">${ic("alert")}<div>Can't reach the i-read-code server, so decisions can't be saved. Ask Claude to restart the review server, then reload this page.</div></div>`;
  if (v.kind === "overview") h += renderOverview();
  else if (v.kind === "file") h += renderFile(FILES.get(v.path));
  else if (v.kind === "context") h += renderContext(CTX.get(v.path));
  main.innerHTML = h;
}

function renderRelated() {
  const v = state.view;
  const aside = $("related");
  let h = "";
  if (v.kind === "overview") {
    const pending = DATA.changes.filter(c => decision(c.id).status === "pending");
    const high = pending.filter(c => c.importance === "high");
    h += `<section><h3>How to review</h3><div class="keys">Pick a file on the left. Each explained change has <b>Confirm</b> and <b>Request Change</b>; a change request asks for a reason. Connected files show up here on the right.${state.ask.available ? " <b>Ask Claude</b> on any change (or below the overview) to ask a question; answers can read the code but never edit it." : ""}</div></section>`;
    if (high.length) h += `<section><h3>High importance, pending</h3>${high.map(miniItem).join("")}</section>`;
  } else {
    const links = DATA.connections[v.path] || [];
    h += `<section><h3>${v.kind === "context" ? "Linked from" : "Connected files"}</h3>`;
    if (!links.length) h += `<div class="keys">No connected files.</div>`;
    for (const l of links) {
      const changed = FILES.has(l.path);
      h += `<button class="rel" data-act="open" data-path="${esc(l.path)}" data-from="${esc(v.path)}"><div class="rp"><span>${esc(l.path).replace(/\//g, "/<wbr>")}</span><span class="kind ${changed ? "changed" : "context"}">${changed ? "changed" : "context"}</span>${changed ? fileChip(l.path) : ""}</div><div class="rr">${inline(l.reason)}</div></button>`;
    }
    h += `</section>`;
    if (v.kind === "file") {
      const list = BY_FILE.get(v.path) || [];
      if (list.length) h += `<section><h3>Items in this file</h3>${list.map(miniItem).join("")}</section>`;
    }
  }
  h += `<section><h3>Keys</h3><div class="keys grid">
    <span><kbd>j</kbd> <kbd>k</kbd></span><span>next / previous item</span>
    <span><kbd>c</kbd></span><span>confirm</span>
    <span><kbd>d</kbd></span><span>request change</span>
    ${state.ask.available ? `<span><kbd>a</kbd></span><span>ask Claude about it</span>` : ""}
    <span><kbd>⇧</kbd> <kbd>C</kbd></span><span>confirm all in file</span>
    <span><kbd>n</kbd></span><span>next pending anywhere</span>
    <span><kbd>[</kbd> <kbd>]</kbd></span><span>previous / next file</span>
    <span><kbd>b</kbd></span><span>back</span>
    <span><kbd>t</kbd></span><span>theme: system / light / dark</span></div></section>`;
  aside.innerHTML = h;
}

function renderAll(keepScroll = true) {
  const main = $("main");
  const top = main.scrollTop;
  const a = document.activeElement;
  const askFocus = a && a.dataset && a.dataset.askInput;
  const askPos = askFocus ? a.selectionStart : 0;
  renderHeader(); renderFiles(); renderMain(); renderRelated();
  if (keepScroll) main.scrollTop = top;
  if (state.editing) {
    const t = $("reason");
    if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
  } else if (askFocus) {
    const t = document.querySelector(`[data-ask-input="${CSS.escape(askFocus)}"]`);
    if (t) { t.focus(); t.setSelectionRange(askPos, askPos); }
  }
}

// ---------- navigation ----------
function navigate(view, push = true) {
  const cur = state.view;
  if (push && (cur.kind !== view.kind || cur.path !== view.path)) state.history.push(cur);
  state.view = view; state.editing = null; state.focus = null;
  renderAll(false);
  $("main").scrollTop = 0;
  if (view.kind === "context") {
    const first = document.querySelector("tr.focus-line");
    if (first) first.scrollIntoView({ block: "center" });
  }
}
function openPath(path, from) {
  if (FILES.has(path)) navigate({ kind: "file", path });
  else if (CTX.has(path)) navigate({ kind: "context", path, from });
}
function goto(id, smooth = true) {
  const c = CHANGES.get(id);
  if (!c) return;
  if (state.view.kind !== "file" || state.view.path !== c.file) navigate({ kind: "file", path: c.file });
  setFocus(id, smooth);
}
function setFocus(id, smooth = true) {
  state.focus = id;
  document.querySelectorAll(".card.focused").forEach(el => el.classList.remove("focused"));
  document.querySelectorAll("tr.hl").forEach(el => el.classList.remove("hl"));
  if (!id) return;
  const el = document.querySelector(`[data-card="${CSS.escape(id)}"]`);
  if (el) {
    el.classList.add("focused");
    el.scrollIntoView({ block: "center", behavior: smooth && !REDUCED_MOTION ? "smooth" : "auto" });
  }
  highlightRows(id, true);
}
function highlightRows(id, on) {
  document.querySelectorAll("tr[data-ids]").forEach(tr => {
    if (tr.dataset.ids.split(" ").includes(id)) tr.classList.toggle("hl", on);
  });
}
function cardsInView() { return [...document.querySelectorAll("[data-card]")].map(el => el.dataset.card); }
function step(delta) {
  const ids = cardsInView();
  if (!ids.length) return;
  const i = ids.indexOf(state.focus);
  const next = i < 0 ? (delta > 0 ? 0 : ids.length - 1) : Math.min(ids.length - 1, Math.max(0, i + delta));
  setFocus(ids[next]);
}
function nextPending() {
  const list = DATA.changes;
  const start = state.focus ? list.findIndex(c => c.id === state.focus) : -1;
  for (let k = 1; k <= list.length; k++) {
    const c = list[(start + k + list.length) % list.length];
    if (decision(c.id).status === "pending") return goto(c.id);
  }
  toast("Nothing pending. Click Finish review when you're done.", "info");
}
function stepFile(delta) {
  const paths = DATA.files.filter(fileVisible).map(f => f.path);
  const i = state.view.kind === "file" ? paths.indexOf(state.view.path) : -1;
  const j = Math.min(paths.length - 1, Math.max(0, i + delta));
  if (j !== i) navigate({ kind: "file", path: paths[j] });
}

// ---------- server ----------
async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  return json;
}
function applyState(doc) {
  state.decisions = {};
  for (const it of doc.items || []) state.decisions[it.change_id] = { status: it.status, reason: it.reason || "" };
  state.finished = doc.status === "finished";
  state.threads = {};
  for (const t of doc.questions || []) state.threads[t.thread] = t.messages || [];
  if (doc.ask) state.ask = doc.ask;
}
async function decide(id, status, reason = "", advance = false) {
  try {
    applyState(await api("/api/decision", { change_id: id, status, reason }));
    state.editing = null; state.draft = "";
    renderAll();
    if (advance) {
      const ids = cardsInView();
      const after = ids.slice(ids.indexOf(id) + 1).find(x => decision(x).status === "pending");
      setFocus(after || id);
    } else if (state.focus) setFocus(state.focus, false);
  } catch (e) {
    toast("Couldn't save: " + e.message);
  }
}
// Bulk confirm only touches pending items, so earlier change requests are never overwritten.
async function decideMany(ids, status, what) {
  if (!ids.length || !state.online) return;
  try {
    applyState(await api("/api/decisions", { change_ids: ids, status }));
    if (state.editing && ids.includes(state.editing)) { state.editing = null; state.draft = ""; }
    renderAll();
    if (state.focus) setFocus(state.focus, false);
    if (status === "confirmed") {
      toast(`Confirmed ${plural(ids.length, "item")} ${what}.`, "info", { label: "Undo", run: () => decideMany(ids, "pending", what) });
    } else {
      toast(`Moved ${plural(ids.length, "item")} back to pending.`, "info");
    }
  } catch (e) {
    toast("Couldn't save: " + e.message);
  }
}
function confirmFile(path) {
  decideMany(pendingIds(BY_FILE.get(path) || []), "confirmed", `in ${splitPath(path)[1]}`);
}
function confirmLevel(level) {
  decideMany(pendingIds(DATA.changes.filter(c => c.importance === level)), "confirmed", `of ${level} importance`);
}
async function finish() {
  const c = countsFor(DATA.changes);
  if (c.pending && !confirm(`${c.pending} item(s) are still pending. Finish anyway?`)) return;
  try {
    const doc = await api("/api/finish", {});
    applyState(doc); state.online = false; renderAll();
    const o = document.createElement("div");
    o.className = "done-overlay";
    o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true");
    o.innerHTML = `<div class="box"><div class="badge">${ic("check", "")}</div><h2>Review saved</h2><p>${doc.counts.confirmed} confirmed, ${doc.counts.declined} changes requested, ${doc.counts.pending} pending.</p><p>Decisions are in <code>review.json</code> next to this page. Go back to Claude; it will pick up the review from there.</p></div>`;
    document.body.appendChild(o);
  } catch (e) { toast("Couldn't finish: " + e.message); }
}
let toastTimer;
function toast(msg, kind = "bad", action = null) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast" + (kind === "bad" ? " bad" : "");
  t.setAttribute("role", kind === "bad" ? "alert" : "status");
  const span = document.createElement("span");
  span.textContent = msg; t.appendChild(span);
  if (action) {
    const b = document.createElement("button");
    b.innerHTML = ic("undo") + " " + esc(action.label);
    b.addEventListener("click", () => { t.remove(); action.run(); });
    t.appendChild(b);
  }
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), action ? 7000 : 3500);
}

// ---------- events ----------
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case "overview": navigate({ kind: "overview" }); break;
    case "open": openPath(el.dataset.path, el.dataset.from || (state.view.kind !== "overview" ? state.view.path : null)); break;
    case "goto": goto(id); break;
    case "back": { const prev = state.history.pop(); if (prev) navigate(prev, false); break; }
    case "importance": {
      const lv = el.dataset.level;
      if (state.importance.has(lv)) state.importance.delete(lv); else state.importance.add(lv);
      renderFiles(); break;
    }
    case "mode": state.mode = el.dataset.mode; renderAll(false); break;
    case "expand": state.expanded.add(el.dataset.key); renderAll(); break;
    case "show-generated": state.showGenerated.add(el.dataset.path); renderAll(); break;
    case "confirm": state.focus = id; decide(id, "confirmed"); break;
    case "confirm-file": confirmFile(el.dataset.path); break;
    case "confirm-level": confirmLevel(el.dataset.level); break;
    case "decline": state.focus = id; state.editing = id; state.draft = decision(id).reason || ""; renderAll(); break;
    case "cancel": state.editing = null; state.draft = ""; renderAll(); break;
    case "submit-decline": submitDecline(id); break;
    case "undo": decide(id, "pending"); break;
    case "next-pending": nextPending(); break;
    case "finish": finish(); break;
    case "theme": cycleTheme(); break;
    case "ask":
      if (state.askOpen.has(id)) { state.askOpen.delete(id); renderAll(); } else { state.focus = id; openAsk(id); }
      break;
    case "ask-submit": ask(id); break;
  }
});
function submitDecline(id, advance = false) {
  const reason = ($("reason") || {}).value || "";
  if (!reason.trim()) { toast("Add a reason for the change request."); $("reason") && $("reason").focus(); return; }
  decide(id, "declined", reason, advance);
}
document.addEventListener("input", e => {
  if (e.target.id === "filter") { state.filter = e.target.value; renderFiles(); }
  if (e.target.id === "reason") state.draft = e.target.value;
  if (e.target.dataset.askInput) state.askDraft[e.target.dataset.askInput] = e.target.value;
});
document.addEventListener("mouseover", e => {
  const card = e.target.closest("[data-card]");
  document.querySelectorAll("tr.hl").forEach(el => { if (!state.focus || !el.dataset.ids.split(" ").includes(state.focus)) el.classList.remove("hl"); });
  if (card) highlightRows(card.dataset.card, true);
});
document.addEventListener("keydown", e => {
  const typing = e.target.matches("textarea, input");
  if (e.target.id === "reason") {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitDecline(state.editing, true); }
    if (e.key === "Escape") { state.editing = null; state.draft = ""; renderAll(); }
    return;
  }
  const askId = e.target.dataset.askInput;
  if (askId) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ask(askId); }
    if (e.key === "Escape") {
      e.target.blur();
      if (askId !== GENERAL) { state.askOpen.delete(askId); renderAll(); setFocus(askId, false); }
    }
    return;
  }
  if (typing) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const f = state.focus;
  switch (e.key) {
    case "j": step(1); break;
    case "k": step(-1); break;
    case "n": nextPending(); break;
    case "]": stepFile(1); break;
    case "[": stepFile(-1); break;
    case "b": { const prev = state.history.pop(); if (prev) navigate(prev, false); break; }
    case "c": if (f && state.online) decide(f, "confirmed", "", true); break;
    case "C": if (state.view.kind === "file") confirmFile(state.view.path); break;
    case "t": cycleTheme(); break;
    case "a": if (f && state.online && state.ask.available) { e.preventDefault(); openAsk(f); } break;
    case "d": if (f && state.online) { e.preventDefault(); state.editing = f; state.draft = decision(f).reason || ""; renderAll(); } break;
    default: return;
  }
});

(async function init() {
  try {
    applyState(await api("/api/state"));
    state.online = !state.finished;
  } catch (e) {
    state.online = false;
  }
  renderAll(false);
})();
</script>
</body>
